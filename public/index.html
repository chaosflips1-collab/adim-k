<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AdımKasası PRO v2 - Giriş Yap</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 920px;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8), 0 0 0 12px #0f172a;
            border-radius: 44px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px 24px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .app-shell {
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
                border: none;
            }
        }

        .mobile-notch {
            width: 140px;
            height: 24px;
            background: #000000;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notch-camera {
            width: 10px;
            height: 10px;
            background: #1e1b4b;
            border-radius: 50%;
        }

        .badge-v2 {
            display: inline-block;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
        }

        .logo-icon {
            font-size: 40px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            margin: 0 auto 15px auto;
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.45);
        }

        h2 { 
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin: 6px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }

        .google-btn {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            background: #ffffff;
            color: #1e293b;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }

        .google-btn:active {
            transform: scale(0.97);
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #64748b;
            margin: 10px 0 16px 0;
            width: 100%;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 10px;
            font-size: 12px;
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            transition: all 0.2s ease;
        }

        button.action-btn:active { 
            transform: scale(0.97);
        }

        .switch-container {
            margin-top: 18px;
            font-size: 13px;
            color: #94a3b8;
        }

        .switch-btn {
            background: transparent;
            color: #ec4899;
            border: none;
            cursor: pointer;
            font-weight: 700;
            padding: 0 4px;
        }

        .feature-chips {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11px;
            color: #cbd5e1;
        }

        #message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            display: none;
            width: 100%;
        }

        .msg-error { background: rgba(248, 113, 113, 0.2); color: #f87171; display: block !important; }
        .msg-success { background: rgba(74, 222, 128, 0.2); color: #4ade80; display: block !important; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="mobile-notch"><div class="notch-camera"></div></div>

        <span class="badge-v2">MOBİL APP SÜRÜMÜ</span>
        <div class="logo-icon">👟</div>
        <h2>AdımKasası PRO</h2>
        <p class="subtitle">Yürü, Yarış, Bağış Yap & Ödülleri Kap!</p>

        <!-- GOOGLE İLE GİRİŞ / KAYIT -->
        <button type="button" class="google-btn" onclick="handleGoogleAuth()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="google-icon">
            Google İle Devam Et
        </button>

        <div class="divider"><span>veya e-posta ile</span></div>

        <!-- REGISTER -->
        <div id="registerContainer" style="width:100%;">
            <form id="registerForm">
                <input type="text" id="regName" placeholder="Ad Soyad" required>
                <input type="email" id="regEmail" placeholder="E-posta Adresi" required>
                <input type="password" id="regPassword" placeholder="Şifre" required>
                <div style="display:flex; gap:8px;">
                    <input type="number" id="regHeight" placeholder="Boy (cm)" required style="flex:1;">
                    <input type="number" id="regWeight" placeholder="Kilo (kg)" required style="flex:1;">
                </div>
                <button type="submit" class="action-btn">PRO Hesabını Oluştur</button>
            </form>
            <div class="switch-container">
                Hesabın var mı? <button class="switch-btn" onclick="toggleForm('login')">Giriş Yap</button>
            </div>
        </div>

        <!-- LOGIN -->
        <div id="loginContainer" class="hidden" style="width:100%;">
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="E-posta Adresi" required>
                <input type="password" id="loginPassword" placeholder="Şifre" required>
                <button type="submit" class="action-btn">Giriş Yap</button>
            </form>
            <div class="switch-container">
                Hesabın yok mu? <button class="switch-btn" onclick="toggleForm('register')">Hemen Kaydol</button>
            </div>
        </div>

        <div id="message"></div>

        <div class="feature-chips">
            <span class="chip">🏆 Liderlik</span>
            <span class="chip">🎡 Şans Çarkı</span>
            <span class="chip">🐾 Mama Bağışı</span>
        </div>

        <div style="margin-top:14px; font-size:10px; color:#64748b; text-align:center;">
            <a href="#" onclick="openLegalModal('kvkk')" style="color:#94a3b8; text-decoration:none; margin:0 4px;">KVKK Aydınlatma Metni</a> •
            <a href="#" onclick="openLegalModal('privacy')" style="color:#94a3b8; text-decoration:none; margin:0 4px;">Gizlilik Politikası</a> •
            <a href="#" onclick="openLegalModal('terms')" style="color:#94a3b8; text-decoration:none; margin:0 4px;">Kullanım Şartları</a>
        </div>
    </div>

    <!-- LEGAL POPUP MODAL -->
    <div id="legalModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2,6,23,0.85); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; z-index:9999; padding:20px;">
        <div style="background:#1e1b4b; border:1px solid rgba(255,255,255,0.2); border-radius:24px; padding:20px; max-width:400px; width:100%; max-height:80vh; overflow-y:auto; font-size:12px; color:#cbd5e1;">
            <h3 id="legalTitle" style="color:#fff; margin-bottom:10px;">Yasal Metin</h3>
            <div id="legalBody" style="line-height:1.5; color:#94a3b8;"></div>
            <button type="button" class="action-btn" style="margin-top:14px; width:100%;" onclick="closeLegalModal()">Kapat</button>
        </div>
    </div>

    <script>
        if (localStorage.getItem('token_v2')) {
            window.location.href = '/dashboard.html';
        }

        const registerContainer = document.getElementById('registerContainer');
        const loginContainer = document.getElementById('loginContainer');
        const message = document.getElementById('message');

        function showMsg(text, isErr = false) {
            message.className = isErr ? 'msg-error' : 'msg-success';
            message.textContent = text;
        }

        function toggleForm(type) {
            message.style.display = 'none';
            if (type === 'login') {
                registerContainer.classList.add('hidden');
                loginContainer.classList.remove('hidden');
            } else {
                loginContainer.classList.add('hidden');
                registerContainer.classList.remove('hidden');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            const height = parseInt(document.getElementById('regHeight').value) || 175;
            const weight = parseInt(document.getElementById('regWeight').value) || 70;

            try {
                const res = await fetch('/api/v2/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, height, weight })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token_v2', data.token);
                    showMsg('Kayıt başarılı!');
                    setTimeout(() => window.location.href = '/dashboard.html', 700);
                } else {
                    showMsg(data.error, true);
                }
            } catch (err) {
                showMsg('Sunucu hatası!', true);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/v2/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token_v2', data.token);
                    showMsg('Giriş başarılı!');
                    setTimeout(() => window.location.href = '/dashboard.html', 700);
                } else {
                    showMsg(data.error, true);
                }
            } catch (err) {
                showMsg('Sunucu hatası!', true);
            }
        });
        async function handleGoogleAuth() {
            const email = prompt("Google hesabı ile tek tıkla giriş/kayıt için Gmail adresinizi girin:", "ornek@gmail.com");
            if (!email) return;

            const name = email.split('@')[0].toUpperCase();
            try {
                const res = await fetch('/api/v2/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, name })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token_v2', data.token);
                    showMsg(data.message);
                    setTimeout(() => window.location.href = '/dashboard.html', 700);
                } else {
                    showMsg(data.error, true);
                }
            } catch (err) {
                showMsg('Google bağlantı hatası!', true);
            }
        }
        function openLegalModal(type) {
            const m = document.getElementById('legalModal');
            const title = document.getElementById('legalTitle');
            const body = document.getElementById('legalBody');
            m.style.display = 'flex';

            if (type === 'kvkk') {
                title.textContent = '🔒 KVKK Aydınlatma Metni';
                body.innerHTML = '<p>6698 Sayılı Kişisel Verilerin Korunması Kanunu (KVKK) uyarınca, AdımKasası PRO platformunda işlenen ad, e-posta, boy, kilo ve adım verileriniz yalnızca hesap güvenliği, adım dönüştürme ve kişiselleştirilmiş kalori hesaplaması amacıyla güvenli MongoDB bulut sunucularında saklanmaktadır. Verileriniz 3. şahıslarla asla paylaşılmaz.</p>';
            } else if (type === 'privacy') {
                title.textContent = '🛡️ Gizlilik Politikası';
                body.innerHTML = '<p>Gizliliğiniz bizim için önemlidir. Google Sign-In veya e-posta ile oturum açtığınızda adınız ve e-posta adresiniz hesabınızı doğrulamak ve kupon kodlarınızı profilinize tanımlamak için kullanılır. Dilediğiniz zaman hesabınızın silinmesini talep edebilirsiniz.</p>';
            } else {
                title.textContent = '📜 Kullanım Şartları & Bağış Havuzu';
                body.innerHTML = '<p>AdımKasası PRO uygulamasını kullanarak günlük adımlarınızı YürüPara birimine dönüştürebilirsiniz. Günlük dönüştürme limiti 15.000 adımdır. Hileli yazılım, otomasyon veya haksız puan kazanma girişimlerinde bulunan hesaplar askıya alınır.<br><br><strong>Sosyal Bağış Şartları:</strong> Kullanıcılarımızın adımlarıyla yaptığı sosyal bağışlar, AdımKasası\'nın her ay elde ettiği net reklam ve sponsorluk gelirlerinin %40\'lık havuzundan ilgili STK\'lara (TEMA, LÖSEV, HAYTAP vb.) resmi olarak aktarılır.</p>';
            }
        }

        function closeLegalModal() {
            document.getElementById('legalModal').style.display = 'none';
        }
    </script>
</body>
</html>
