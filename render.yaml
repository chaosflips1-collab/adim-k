services:
  - type: web
    name: adimkasasi-v2
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Değerler artık burada DEĞİL - Render Dashboard > Environment üzerinden
      # elle girilir (sync: false). Daha önce burada düz metin olarak duran
      # MongoDB Atlas şifresi ve JWT_SECRET git geçmişine işlenmişti; bu
      # değerlerin rotasyona sokulması (yeni şifre/secret üretip Atlas ve
      # Render tarafında güncellemek) gerekiyor - bkz. Obsidian "Önemli
      # Yapılacaklar" notu, bu repo bunu otomatik yapamaz.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
